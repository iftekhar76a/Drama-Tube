<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>নাটকঘর</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #f5f5f5; }
    header { background: #d32f2f; color: white; text-align: center; padding: 15px; font-size: 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 15px;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: 0.2s;
      overflow: hidden;
    }
    .card:hover { transform: scale(1.02); }
    .card img { width: 100%; height: 150px; object-fit: cover; }
    .card h3 { padding: 10px; font-size: 18px; margin: 0; }
  </style>
</head>
<body>
  <header>নাটকঘর</header>
  <div class="grid" id="dramaGrid"></div>
  <script>
    fetch('dramas.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('dramaGrid');
        data.forEach(drama => {
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => {
            const t = encodeURIComponent(drama.title);
            const s = encodeURIComponent(drama.video);
            location.href = `player.html?title=${t}&src=${s}`;
          };
          card.innerHTML = `
            <img src="${drama.thumbnail}" alt="${drama.title}">
            <h3>${drama.title}</h3>
          `;
          container.appendChild(card);
        });
      });
  </script>
</body>
</html>
