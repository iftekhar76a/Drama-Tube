<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>নাটক প্লেয়ার</title>
  <style>
    body { margin: 0; background: #000; color: white; font-family: sans-serif; }
    header { background: #d32f2f; text-align: center; padding: 15px; font-size: 22px; }
    .video-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px;
    }
    iframe {
      width: 90%;
      max-width: 800px;
      height: 450px;
      border: none;
    }
    .ad {
      margin-top: 20px;
      width: 300px;
      height: 250px;
      background: #ccc;
      color: #000;
      text-align: center;
      line-height: 250px;
    }
  </style>
</head>
<body>
  <header id="title">নাটক প্লেয়ার</header>
  <div class="video-container">
    <iframe id="player" src="" allowfullscreen></iframe>
    <div class="ad">Adsterra Banner</div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const title = decodeURIComponent(params.get("title"));
    const src = decodeURIComponent(params.get("src"));
    document.getElementById("title").innerText = title;
    document.getElementById("player").src = src;
  </script>
</body>
</html>
