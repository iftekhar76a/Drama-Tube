<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel - নাটক যোগ করুন</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f3f3f3; }
    h1 { color: #d32f2f; }
    input, button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      font-size: 16px;
    }
    .preview {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>নতুন নাটক যোগ করুন</h1>
  <input type="text" id="title" placeholder="নাটকের নাম" />
  <input type="text" id="thumbnail" placeholder="থাম্বনেইল লিংক (img)" />
  <input type="text" id="videoLink" placeholder="ভিডিও লিংক (Google Drive/MP4)" />
  <button onclick="addDrama()">যোগ করুন</button>
  <div class="preview">
    <h3>নতুন নাটক প্রিভিউ:</h3>
    <pre id="jsonOutput"></pre>
  </div>
  <script>
    let dramas = [];
    function addDrama() {
      const title = document.getElementById('title').value.trim();
      const thumbnail = document.getElementById('thumbnail').value.trim();
      const videoLink = document.getElementById('videoLink').value.trim();
      if (!title || !thumbnail || !videoLink) {
        alert("সব তথ্য দিন");
        return;
      }
      const newDrama = { title, thumbnail, video: videoLink };
      dramas.push(newDrama);
      document.getElementById('jsonOutput').innerText = JSON.stringify(dramas, null, 2);
      document.getElementById('title').value = '';
      document.getElementById('thumbnail').value = '';
      document.getElementById('videoLink').value = '';
    }
  </script>
</body>
</html>
